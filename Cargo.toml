[package]
name = "solana-mev-arb"
version = "0.1.0"
edition = "2021"
description = "High-Performance Low-Latency Solana Cross-DEX Arbitrage Engine with Mainnet Shadow Paper-Trading"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures = "0.3"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
url = "2.5"
dashmap = "6.1"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
